name: Effigies Build & Push to Aliyun ACR
run-name: ${{ github.actor }} build effigies runtime image
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.cpu'
      - '.github/workflows/docker_aliyun.yml'
  workflow_dispatch:
    inputs:
      image_type:
        description: '选择镜像类型 (cuda 或 cpu)'
        required: true
        default: 'cuda'
        type: choice
        options:
          - cuda
          - cpu

jobs:
  build-push:
    name: Build & Push Effigies Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Determine build type
        id: set-build-type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.image_type }}"
          else
            # push 事件：从所有提交中提取新增/修改的文件列表
            FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | .added[], .modified[]' | sort -u)
            echo "Changed files: $FILES"
            HAS_CUDA=false
            HAS_CPU=false
            if echo "$FILES" | grep -q "Dockerfile$"; then
              HAS_CUDA=true
            fi
            if echo "$FILES" | grep -q "Dockerfile.cpu$"; then
              HAS_CPU=true
            fi
            if [ "$HAS_CUDA" = true ] && [ "$HAS_CPU" = true ]; then
              echo "Both Dockerfile and Dockerfile.cpu changed, defaulting to CUDA"
              BUILD_TYPE="cuda"
            elif [ "$HAS_CUDA" = true ]; then
              BUILD_TYPE="cuda"
            elif [ "$HAS_CPU" = true ]; then
              BUILD_TYPE="cpu"
            else
              BUILD_TYPE="cuda"
            fi
          fi

          echo "BUILD_TYPE=$BUILD_TYPE"
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          if [ "$BUILD_TYPE" = "cpu" ]; then
            echo "dockerfile=Dockerfile.cpu" >> $GITHUB_OUTPUT
            echo "tag_suffix=-cpu" >> $GITHUB_OUTPUT
          else
            echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
            echo "tag_suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Effigies image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.set-build-type.outputs.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/effigies:latest${{ steps.set-build-type.outputs.tag_suffix }}
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Clean up Docker resources
        if: always()
        run: docker system prune -f

      - name: Build success notification
        if: success()
        run: echo "✅ Effigies 镜像构建并推送至阿里云 ACR 完成 (类型: ${{ steps.set-build-type.outputs.build_type }})"
